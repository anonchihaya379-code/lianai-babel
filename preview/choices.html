<!-- lbt-choices -->
<section class="lbtc">
  <span class="lbtc-float lbtc-f1" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/></svg></span>
  <span class="lbtc-float lbtc-f2" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7z"/></svg></span>
  <span class="lbtc-float lbtc-f3" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 2c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7z"/></svg></span>
  <span class="lbtc-float lbtc-f4" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/></svg></span>
  <header class="lbtc-head">
    <div class="lbtc-title">你会怎么做呢</div>
    {% if prompt %}<p class="lbtc-prompt">{{ prompt }}</p>{% endif %}
  </header>
  <div class="lbtc-list">
    {% for o in options %}
      {% case o.kind %}
        {% when "zhinan" %}{% assign tag = "直男" %}
        {% when "gonglue" %}{% assign tag = "攻略" %}
        {% when "lezi" %}{% assign tag = "乐子人" %}
        {% else %}{% assign tag = "选择" %}
      {% endcase %}
      <button type="button" class="lbtc-opt is-{{ o.kind }}" data-action-send="【{{ tag }}】{{ o.text | escape }}">
        <span class="lbtc-tag">
          {% case o.kind %}
            {% when "zhinan" %}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3.5 4.6 6 8 6 11a6 6 0 0 1-12 0c0-3 2.5-6.4 6-11z"/></svg>
            {% when "gonglue" %}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"/></svg>
            {% when "lezi" %}<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 16.9l-5.9 3.3 1.3-6.6L2.5 9l6.6-.8z"/></svg>
            {% else %}<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="6"/></svg>
          {% endcase %}{{ tag }}
        </span>
        <span class="lbtc-text">{{ o.text }}</span>
      </button>
    {% endfor %}
  </div>
  <details class="lbtc-own">
    <summary><span class="lbtc-own-pill">都不想选？自己写一句</span></summary>
    <form class="lbtc-form">
      <input class="lbtc-input" type="text" name="action" data-label="我的行动" placeholder="比如：「你什么时候学会撬锁的？」">
      <button type="button" class="lbtc-send" data-action-submit>就这么说</button>
    </form>
  </details>
</section>
