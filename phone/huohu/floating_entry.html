<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>恋爱巴别塔 · 手机</title><style>html,body{margin:0;background:transparent}.boot{position:absolute;right:16px;bottom:16px;height:34px;padding:0 14px;border-radius:17px;background:#1c1d22;color:#ddd;font:12px/1 sans-serif;display:flex;align-items:center;gap:8px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.3)}.boot button{border:0;background:#12b7f5;color:#fff;padding:4px 8px;border-radius:7px;cursor:pointer;font-size:11px}</style></head><body><div id="lbp-mount" data-huohu-floating><div class="boot" aria-label="手机加载中"><span>开机中…</span><button type="button" data-retry hidden>重试</button></div></div><script>
/* 资源基址钉死到提交哈希：换版本 = 改下面两行里的 @COMMIT 再保存 */
const bases=["https://cdn.jsdelivr.net/gh/__OWNER__/__REPO__@__COMMIT__/phone/","https://fastly.jsdelivr.net/gh/__OWNER__/__REPO__@__COMMIT__/phone/"];
window.LBP_RESOURCE_BASES=bases;function load(tag,url){return new Promise((ok,no)=>{const el=document.createElement(tag),t=setTimeout(()=>{el.remove();no(Error('timeout'))},15000);if(tag==='link'){el.rel='stylesheet';el.href=url}else{el.src=url;el.async=false}el.onload=()=>{clearTimeout(t);ok(el)};el.onerror=()=>{clearTimeout(t);el.remove();no(Error('network'))};document.head.append(el)})}let busy=false;async function boot(){if(busy)return;busy=true;const r=document.querySelector('[data-retry]');r.hidden=true;for(const b of bases){let css;try{css=await load('link',b+'theme.css');await load('script',b+'app.js');busy=false;return}catch(e){css&&css.remove()}}document.querySelector('.boot span').textContent='加载失败';r.hidden=false;busy=false}document.querySelector('[data-retry]').onclick=boot;boot()</script></body></html>
